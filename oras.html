<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alege Meseria - Orasul Meseriilor</title>
    <link rel="stylesheet" href="css/style-oras.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="page-oras">
    <a href="index.html" class="back-btn-big">
      <svg viewBox="0 0 24 24" width="45" height="45" fill="white">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
      </svg>
    </a>
    <h1 class="titlu-meserii">Pe cine ajutăm azi?</h1>

    <div class="people-container">
      <a href="jocuri/chimist.html" class="character-card active-bouncy">
        <div class="img-wrapper">
          <div class="glow-effect"></div>
          <img
            src="imagini/meserii/chimista.svg"
            alt="Chimist"
            class="char-img"
          />
        </div>
        <span class="btn-label label-green">Chimist</span>
      </a>

      <a href="jocuri/meteorolog.html" class="character-card active-bouncy">
        <div class="img-wrapper">
          <img
            src="imagini/meserii/meteorolog.svg"
            alt="Meteorolog"
            class="char-img"
          />
        </div>
        <span class="btn-label label-green">Meteorolog</span>
      </a>

      <a href="jocuri/electrician.html" class="character-card active-bouncy">
          <div class="img-wrapper">
              <img
                  src="imagini/meserii/electrician.svg"
                  alt="Electrician"
                  class="char-img"
              />
          </div>
          <span class="btn-label label-green">Electrician</span>
      </a>

      <a href="jocuri/politist.html" class="character-card active-bouncy">
        <div class="img-wrapper">
          <img
            src="imagini/meserii/politist.svg"
            alt="Politist"
            class="char-img"
          />
        </div>
        <span class="btn-label label-green">Polițist</span>
      </a>

      <a href="jocuri/pompier.html" class="character-card active-bouncy">
        <div class="img-wrapper">
          <img
            src="imagini/meserii/pompier.svg"
            alt="Pompier"
            class="char-img"
          />
        </div>
        <span class="btn-label label-green">Pompier</span>
      </a>

      <a href="jocuri/mecanic.html" class="character-card active-bouncy">
        <div class="img-wrapper">
          <img
                  src="imagini/meserii/mecanic.svg"
                  alt="Mecanic"
                  class="char-img"
          />
        </div>
        <span class="btn-label label-green">Mecanic</span>
      </a>
      <a href="jocuri/doctorita.html" class="character-card active-bouncy">
         <div class="img-wrapper">
           <img
               src="imagini/meserii/doctorita.svg"
               alt="Doctorita"
               class="char-img"
           />
         </div>
           <span class="btn-label label-green">Doctor</span>
       </a>
    </div>

    <script src="js/speech.js"></script>
    <script>
      // === Hover speech for each character (uses shared `say`) ===
      document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".character-card").forEach(card => {
          card.addEventListener("mouseenter", () => {
            const label = card.querySelector(".btn-label").innerText.trim();
            // use the shared say so it respects the global speech rate
            say("alege "+label);
          });

          // Optional: stop speaking when leaving hover
          card.addEventListener("mouseleave", () => {
            speechSynthesis.cancel();
          });
        });

        // Try to say a short welcome immediately; many browsers block autoplay,
        // so also register a fallback to speak on the first user gesture.
        const welcome = "Bun venit în Orasul Meseriilor! Alege pe cine vrei să ajuți.";
        try { say(welcome); } catch (e) { /* ignore */ }
        speakOnFirstGesture(welcome);
      });
    </script>

  </body>
</html>
