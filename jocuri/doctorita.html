<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cabinetul Mic - Doctorița</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style-doctorita.css" />
  </head>
  <body>
    <a href="../oras.html" class="back-btn">
      <svg viewBox="0 0 24 24" width="45" height="45" fill="white">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
      </svg>
    </a>

    <div class="game-container">
      
      <div id="scena-intro" class="scene active">
        <h1>Cabinetul Doctoriței</h1>
        <img
          src="../imagini/doctorita/doctorita.svg"
          class="character-large float-anim"
          alt="Doctorița"
        />
        
        <div class="start-button-container" style="display: flex; justify-content: center; margin-top: 30px;">
            <button class="btn-icon-large pulse-element" onclick="nextScene('scena-1')" style="width: 120px; height: 120px; border-radius: 50%; background-color: #ff4757; border: none; color: white; font-size: 4rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 0 #ff6b81;">
                ▶ 
            </button>
        </div>
      </div>

      <div id="scena-1" class="scene">
        <h2>Pasul 1</h2>
        <div class="dress-up-container">
          <div class="mannequin">
            <img src="../imagini/doctorita/doctorita.svg" class="base-avatar" />
            <img src="../imagini/doctorita/stetoscop.svg" id="wear-stetoscop" class="worn-item hidden" />
            <img src="../imagini/doctorita/halat.svg" id="wear-halat" class="worn-item hidden" />
          </div>
          <div class="items-rack">
            <div class="item" onclick="chooseClothing('stetoscop', this, true)"><img src="../imagini/doctorita/stetoscop.svg" /></div>
            <div class="item" onclick="chooseClothing('ursulet', this, false)"><img src="../imagini/doctorita/ursulet.svg" /></div>
            <div class="item" onclick="chooseClothing('parfum', this, false)"><img src="../imagini/doctorita/parfum.svg" /></div>
            <div class="item" onclick="chooseClothing('halat', this, true)"><img src="../imagini/doctorita/halat.svg" /></div>
            <div class="item" onclick="chooseClothing('minge', this, false)"><img src="../imagini/doctorita/minge.svg" /></div>
            <div class="item" onclick="chooseClothing('ochelari', this, false)"><img src="../imagini/doctorita/ochelari.svg" /></div>
          </div>
        </div>
        <button id="btn-next-1" class="btn-next hidden" onclick="nextScene('scena-2')">➜</button>
      </div>

      <div id="scena-2" class="scene">
        <h2>Pasul 2</h2>
        <div class="progress-stars">
            <span class="star" id="star-1">⭐</span>
            <span class="star" id="star-2">⭐</span>
            <span class="star" id="star-3">⭐</span>
            <span class="star" id="star-4">⭐</span>
        </div>
        <div class="sorting-area">
          <div class="items-scattered" id="scattered-items">
            <img src="../imagini/doctorita/seringa.svg" class="sort-item good" onclick="sortMe(this, true)" />
            <img src="../imagini/doctorita/vas.svg" class="sort-item bad" onclick="sortMe(this, false)" />
            <img src="../imagini/doctorita/ursulet.svg" class="sort-item bad" onclick="sortMe(this, false)" />
            <img src="../imagini/doctorita/termometru.svg" class="sort-item good" onclick="sortMe(this, true)" />
            <img src="../imagini/doctorita/pastile.svg" class="sort-item good" onclick="sortMe(this, true)" />
            <img src="../imagini/doctorita/camera.svg" class="sort-item bad" onclick="sortMe(this, false)" />
            <img src="../imagini/doctorita/plasture.svg" class="sort-item good" onclick="sortMe(this, true)" />
          </div>
          <div class="box-container"><img src="../imagini/doctorita/trusa.svg" class="box-img" /></div>
        </div>
        <div id="feedback-visual" style="font-size: 3rem; height: 50px; text-align: center;"></div> 
        <button id="btn-next-2" class="btn-next hidden" onclick="nextScene('scena-3')">➜</button>
      </div>

      <div id="scena-3" class="scene">
        <h2>Pasul 3</h2>
        <div class="reading-game-area">
            <img id="reading-image" src="" class="reading-img" style="height: 200px; cursor: pointer;" />
            <div id="syllables-text" style="font-size: 2.5rem; height: 50px; text-align: center;"></div>
        </div>
        <button id="btn-read-next" class="btn-next hidden" onclick="nextWord()">➜</button>
        <button id="btn-final" class="btn-next hidden" onclick="nextScene('scena-final')">➜</button>
      </div>

      <div id="scena-final" class="scene">
        <div class="confetti-rain">
            <span style="--i:1; background:#f44336;"></span>
            <span style="--i:3; background:#e91e63;"></span>
            <span style="--i:5; background:#ff4757;"></span>
            <span style="--i:7; background:#c2185b;"></span>
        </div>
        <h1 class="rainbow-text">BRAVO!</h1>
        <div class="winner-container"><img src="../imagini/doctorita/doctorita.svg" class="character-large bounce-happy" /></div>
        <a href="../oras.html" class="btn-finish">🏠</a>
      </div>
    </div>
    
    <script src="../js/speech.js"></script>
    <script src="../js/doctorita.js"></script>
  </body>
</html>
